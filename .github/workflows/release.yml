name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: moranweissman/sharko
  HELM_CHART_PATH: charts/sharko

jobs:
  # =========================================================================
  # RELEASE EVIDENCE GATE (v4-coherence-closure, lane M)
  #
  # FINDING this section fixes: this workflow only ever gated publishing on
  # the plain "CI" workflow (go/UI build+test, swagger/schema/provider-type
  # drift checks, helm lint, security scan — see ci.yml). That workflow
  # already runs on every `v*` tag push (ci.yml `on.push.tags`), and this
  # workflow's `workflow_run` trigger already refuses to proceed unless that
  # CI run succeeded on a branch/ref starting with `v` (see every job's
  # `if:` below) — so the standard CI suite was always required. What was
  # NOT required: the full kind-backed e2e suite (label/dispatch/schedule
  # gated in e2e.yml — never runs on a tag push), the perf regression gate
  # (PR-only in perf-regression.yml — never runs on a tag push), and a docs
  # site build (no workflow builds the docs site at all today). A tag could
  # publish having never proven any of those three.
  #
  # The four `release-gate-*` jobs below run that missing evidence directly
  # against the tagged commit (`ref: ${{ github.event.workflow_run.head_branch
  # }}`, same pattern every existing job in this file already uses). They
  # deliberately duplicate steps from e2e.yml / perf-regression.yml instead
  # of calling them as reusable workflows — the same call perf-regression.yml
  # already makes in its own header comment ("a shared composite action adds
  # indirection that's not worth the maintenance until a third workflow
  # needs the same boot"). A release gate is exactly that third case handled
  # the same way: plain duplication, not a promotion pipeline.
  #
  # `release-evidence-gate` is the fan-in job every publish step actually
  # depends on. Why it exists instead of just chaining `needs:` straight
  # from `sign-catalog-entries` to the four evidence jobs: GitHub Actions'
  # default job `if:` is `success()` when needs are present, which already
  # blocks a dependent job whenever a needed job FAILS — but a needed job
  # that gets SKIPPED (e.g. because someone edits an evidence job's `if:`
  # in a way that makes it silently not run) also counts as "not success",
  # so a naive chain would still refuse to publish in that case too... but
  # the workflow RUN's overall conclusion only turns red when a job actually
  # FAILS — a run made entirely of successes and skips reports green. That
  # is the exact hole this gate closes: `release-evidence-gate` runs with
  # `if: always()` (so it cannot itself be skipped away by a bad upstream
  # `if:`), reads every evidence job's `needs.<job>.result` explicitly, and
  # `exit 1`s the moment any of them is not literally `success` — turning
  # a silent skip into a loud, real failure instead of a quiet no-op.
  # =========================================================================

  release-gate-e2e:
    name: "Release Evidence: Full E2E (kind + argocd)"
    # Same gate every publish job in this file uses: only run once the CI
    # workflow succeeded, and only for a run triggered by a `v*` tag push
    # (never for CI runs on plain `main` pushes or PRs).
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install kind + kubectl
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          curl -Lo ./kubectl "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x ./kubectl
          sudo mv ./kubectl /usr/local/bin/kubectl
          kind --version
          kubectl version --client=true

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Run full E2E suite (release evidence)
        env:
          GOTMPDIR: /tmp
          E2E_OFFLINE: "0"
        run: make test-e2e-report

      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-e2e-coverage-${{ github.event.workflow_run.head_branch }}
          path: _dist/e2e-coverage.html
          retention-days: 30

      - name: Upload JUnit XML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-e2e-junit-${{ github.event.workflow_run.head_branch }}
          path: _dist/e2e-junit.xml
          retention-days: 30

      - name: Cleanup stale kind clusters
        if: always()
        run: |
          kind get clusters 2>/dev/null | grep "^sharko-e2e-" | \
            xargs -I{} kind delete cluster --name {} || true

  # Mirrors e2e.yml's `live-gitea` job — the one lane that drives a REAL
  # Gitea server (service container) instead of the in-repo fake, catching
  # drift between the fakes' stub shapes and the real Gitea REST API.
  release-gate-e2e-live-gitea:
    name: "Release Evidence: E2E (live Gitea)"
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      gitea:
        image: gitea/gitea:1.23.5
        ports:
          - 3000:3000
        env:
          GITEA__security__INSTALL_LOCK: "true"
          GITEA__database__DB_TYPE: sqlite3
          GITEA__server__DOMAIN: localhost
          GITEA__server__ROOT_URL: http://localhost:3000/
          GITEA__server__DISABLE_SSH: "true"
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:3000/api/healthz || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 10s
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Wait for Gitea API to answer
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/healthz >/dev/null 2>&1; then
              echo "gitea API is up (attempt $i)"
              exit 0
            fi
            echo "waiting for gitea API... (attempt $i)"
            sleep 2
          done
          echo "gitea API never came up" >&2
          exit 1

      - name: Provision admin user, API token, and test repo
        id: provision
        env:
          GITEA_CONTAINER: ${{ job.services.gitea.id }}
          GITEA_ADMIN_USER: sharko-e2e
          GITEA_ADMIN_PASS: Sharko-E2E-CI-Passw0rd!
          GITEA_REPO: sharko-e2e-live
        run: |
          set -euo pipefail

          # -u 1000:1000 is load-bearing — see e2e.yml's `live-gitea` job for
          # the full explanation (Gitea's CLI refuses to run as root, and the
          # image drops privileges to uid/gid 1000 before starting).
          docker exec -u 1000:1000 "$GITEA_CONTAINER" gitea admin user create \
            --admin \
            --username "$GITEA_ADMIN_USER" \
            --password "$GITEA_ADMIN_PASS" \
            --email "sharko-e2e@example.invalid" \
            --must-change-password=false

          token_json=$(curl -sf -u "$GITEA_ADMIN_USER:$GITEA_ADMIN_PASS" \
            -H "Content-Type: application/json" \
            -d '{"name":"sharko-e2e-ci","scopes":["write:repository","write:issue"]}' \
            "http://localhost:3000/api/v1/users/$GITEA_ADMIN_USER/tokens")
          token=$(echo "$token_json" | jq -r '.sha1 // empty')
          if [ -z "$token" ]; then
            echo "failed to create API token: $token_json" >&2
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

          curl -sf -u "$GITEA_ADMIN_USER:$GITEA_ADMIN_PASS" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"$GITEA_REPO\",\"auto_init\":true,\"default_branch\":\"main\",\"private\":false}" \
            "http://localhost:3000/api/v1/user/repos" >/dev/null

          echo "provisioned admin=$GITEA_ADMIN_USER repo=$GITEA_ADMIN_USER/$GITEA_REPO"

      - name: Run live-Gitea E2E suite
        env:
          GOTMPDIR: /tmp
          SHARKO_E2E_GITEA_URL: http://localhost:3000
          SHARKO_E2E_GITEA_TOKEN: ${{ steps.provision.outputs.token }}
          SHARKO_E2E_GITEA_OWNER: sharko-e2e
          SHARKO_E2E_GITEA_REPO: sharko-e2e-live
          SHARKO_E2E_GITEA_BASE: main
        run: |
          go test -tags=e2e -timeout=10m -v -run '^TestGiteaLiveWriteLoop$' ./tests/e2e/lifecycle/...

      - name: Dump Gitea container logs on failure
        if: failure()
        env:
          GITEA_CONTAINER: ${{ job.services.gitea.id }}
        run: docker logs --tail=200 "$GITEA_CONTAINER" || true

  # Mirrors e2e.yml's `helm-mode-e2e` job — exercises the real boot path
  # (docker build -> kind load -> helm upgrade --install -> bootstrap admin
  # secret -> port-forward), not just the in-process lane.
  release-gate-e2e-helm:
    name: "Release Evidence: E2E (helm + kind + argocd)"
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install kind + kubectl
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          curl -Lo ./kubectl "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x ./kubectl
          sudo mv ./kubectl /usr/local/bin/kubectl
          kind --version
          kubectl version --client=true

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: "latest"

      - name: Run Helm-mode E2E subset
        env:
          GOTMPDIR: /tmp
          E2E_SHARKO_MODE: helm
          SHARKO_E2E_IMAGE_TAG: release-${{ github.event.workflow_run.head_branch }}
        run: make test-e2e-helm

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "=== kind clusters ==="
          kind get clusters || true
          echo "=== nodes (all clusters) ==="
          for c in $(kind get clusters 2>/dev/null); do
            echo "--- cluster: $c ---"
            kubectl --context "kind-$c" describe nodes || true
            echo "--- helm releases in $c ---"
            helm --kube-context "kind-$c" list -A || true
            echo "--- sharko deployment logs in $c ---"
            kubectl --context "kind-$c" logs -n sharko deployment/sharko --tail=200 --all-containers=true || true
            echo "--- argocd pods in $c ---"
            kubectl --context "kind-$c" get pods -n argocd -o wide || true
          done

      - name: Cleanup stale kind clusters
        if: always()
        run: |
          kind get clusters 2>/dev/null | grep "^sharko-e2e-" | \
            xargs -I{} kind delete cluster --name {} || true

  # Mirrors perf-regression.yml's `perf-regression` job. Deliberately no
  # `skip-perf-gate` label escape hatch here — that label exists for PR
  # authors trading off an intentional regression against review speed;
  # a tag has no PR context, and the maintainer's explicit priority for
  # this gate is honesty over speed, so a release always pays the perf
  # tax in full.
  release-gate-perf:
    name: "Release Evidence: Perf Regression Gate (p99 +20% threshold)"
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install kind + kubectl
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          curl -Lo ./kubectl "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x ./kubectl
          sudo mv ./kubectl /usr/local/bin/kubectl
          kind --version
          kubectl version --client=true

      - name: Build perf-baseline-compare
        run: go build -o _dist/perf-baseline-compare ./cmd/perf-baseline-compare

      - name: Run perf harness + capture timings
        env:
          GOTMPDIR: /tmp
          E2E_OFFLINE: "0"
        run: make test-e2e-perf-capture

      - name: Compare against baselines (>20% p99 = fail)
        run: make test-e2e-perf-compare

      - name: Upload captured timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-perf-timings-${{ github.event.workflow_run.head_branch }}
          path: _dist/perf-timings.jsonl
          retention-days: 30

      - name: Cleanup stale kind clusters
        if: always()
        run: |
          kind get clusters 2>/dev/null | grep "^sharko-e2e-" | \
            xargs -I{} kind delete cluster --name {} || true

  # No existing workflow builds the docs site at all — this is the first.
  # `mkdocs build --strict` fails on unresolved internal links, missing nav
  # entries, and orphan pages (same as CONTRIBUTING.md tells contributors to
  # run locally); a release should never publish a version whose docs site
  # doesn't actually build.
  release-gate-docs:
    name: "Release Evidence: Docs Build (mkdocs --strict)"
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: pip install -r docs/requirements.txt

      - name: Build docs (strict)
        run: mkdocs build --strict

  release-evidence-gate:
    name: Release Evidence Gate
    needs:
      - release-gate-e2e
      - release-gate-e2e-live-gitea
      - release-gate-e2e-helm
      - release-gate-perf
      - release-gate-docs
    # `always()` drops the implicit `success()` GitHub would otherwise AND
    # onto this `if:` — see the block comment above for why that matters:
    # this job must run (and fail loudly) even when an evidence job above
    # was skipped rather than failed, so it still needs the outer tag/CI
    # gate spelled out explicitly since `always()` alone would let it fire
    # on every CI completion, tag or not.
    if: >
      always() &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: Verify every release-evidence job actually succeeded
        run: |
          fail=0

          check() {
            local label="$1" result="$2"
            if [ "$result" = "success" ]; then
              echo "  PASS  $label"
            else
              echo "  FAIL  $label (result: $result)"
              fail=1
            fi
          }

          check "Full E2E (kind + argocd)"    "${{ needs.release-gate-e2e.result }}"
          check "E2E (live Gitea)"            "${{ needs.release-gate-e2e-live-gitea.result }}"
          check "E2E (helm + kind + argocd)"  "${{ needs.release-gate-e2e-helm.result }}"
          check "Perf regression gate"        "${{ needs.release-gate-perf.result }}"
          check "Docs build (mkdocs --strict)" "${{ needs.release-gate-docs.result }}"

          if [ "$fail" -ne 0 ]; then
            echo "::error::Release evidence gate FAILED — at least one required job above did not succeed (including any that were skipped). A tag must not publish without ALL release evidence: full e2e, live-Gitea e2e, helm-mode e2e, the perf regression gate, and a strict docs build. No publish step will run."
            exit 1
          fi

          echo "All release evidence jobs passed. Proceeding to publish."

  # cosign-keyless signs every entry in catalog/addons.yaml BEFORE the
  # binary builds, so the embedded YAML inside the released image and
  # CLI archives carries `signature.bundle` URLs that point at release
  # assets uploaded later in the same workflow. The default trust policy
  # whitelists this workflow's cert SAN, so fresh installs see the
  # embedded catalog as Verified out of the box.
  sign-catalog-entries:
    name: Sign Catalog Entries
    # This is the first publish step in the workflow, so it is the one
    # place the release-evidence gate has to be enforced — every other
    # publish job (build-and-push, helm-package, helm-package-engine,
    # goreleaser) already `needs:` its way back to this job, so gating
    # here gates the whole chain. The explicit
    # `needs.release-evidence-gate.result == 'success'` check (rather than
    # relying only on the implicit success() GitHub ANDs onto a `needs:`
    # job by default) says outright, for anyone reading this file, that a
    # skipped or failed evidence gate must stop publishing — see the
    # `release-evidence-gate` job above for why "skipped" needs calling
    # out explicitly instead of trusting the default.
    needs: [release-evidence-gate]
    if: >
      needs.release-evidence-gate.result == 'success' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC token for cosign keyless signing — Fulcio mints a short-lived
      # cert from this token; the cert SAN encodes the workflow ref pattern
      # the default trust policy regex matches.
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.6.5'

      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ github.event.workflow_run.head_branch }}"
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"

      - name: Sign catalog entries (cosign keyless)
        env:
          COSIGN_YES: "true"
        run: |
          TAG="${{ steps.version.outputs.TAG }}"
          BASE="https://github.com/MoranWeissman/sharko/releases/download/${TAG}"
          go run ./cmd/catalog-sign --out _dist/catalog --release-base-url "${BASE}"

      - name: Upload signed catalog + bundles as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: signed-catalog
          path: _dist/catalog/
          if-no-files-found: error
          retention-days: 7

  build-and-push:
    name: Build & Push Docker Image
    needs: sign-catalog-entries
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # id-token: write enables OIDC for cosign keyless signing — Fulcio
      # mints a short-lived cert from the GitHub Actions OIDC token, then
      # the signature is logged to the public Rekor transparency log. No
      # long-lived signing key to rotate.
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      # Pull the signed catalog produced by the sign-catalog-entries job
      # and overwrite catalog/addons.yaml on disk so `//go:embed
      # addons.yaml` bakes the signed bytes into the image. Mutation is
      # confined to this runner workspace; never committed back.
      - name: Download signed catalog artifact
        uses: actions/download-artifact@v4
        with:
          name: signed-catalog
          path: _dist/catalog/

      - name: Use signed catalog for build
        # Guard: a silently-empty signed catalog would still cp without
        # error, baking an empty //go:embed into the released image. The
        # explicit -s check fails the job loud at swap time so a bad
        # cosign-job artifact never ships in a release. The download
        # step's `if-no-files-found: error` covers the missing-file case;
        # this guard catches the truncated/empty-file case.
        run: |
          if [ ! -s _dist/catalog/addons.yaml.signed ]; then
            echo "::error::signed catalog is empty or missing"
            exit 1
          fi
          cp _dist/catalog/addons.yaml.signed catalog/addons.yaml

      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ github.event.workflow_run.head_branch }}"
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "VERSION=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.TAG }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.TAG }}
            type=semver,pattern=v{{version}},value=${{ steps.version.outputs.TAG }}
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up QEMU (cross-arch emulation)
        # buildx needs QEMU registered to cross-compile the alpine
        # final stage for arm64 on an amd64 runner. The heavy stages
        # (npm build, go build) cross-compile natively via
        # --platform=$BUILDPLATFORM in the Dockerfile and don't need
        # emulation; only the final alpine stage's `apk add` still runs
        # per-arch, which is cheap even under emulation — so we register
        # all standard binfmt handlers up front.
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          # Multi-arch: amd64 for traditional cloud nodes, arm64 for
          # Graviton/Ampere/Apple Silicon. buildx assembles a manifest
          # list under the same tag; cosign signs the manifest digest
          # once and the signature covers every per-arch image.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CACHE_BUST=${{ github.event.workflow_run.head_sha }}
            VERSION=${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          # ignore-error=true: on run 30956764008 (2026-08-04) the image
          # itself pushed fine (manifest push done, 9.1s) but the cache
          # export step then failed with "token has no writable scopes"
          # and buildx treated that as a hard build failure, skipping
          # every downstream release job (helm charts, CLI binaries)
          # even though the image was already live in the registry.
          # ignore-error keeps the speed-up when the cache write works
          # and stops the whole release from dying when it doesn't.
          cache-to: type=gha,mode=max,ignore-error=true

      # cosign keyless signing of the published image. Pins the OIDC
      # issuer + repo-scoped certificate identity so a future
      # `cosign verify` run can confirm the signature came from *this*
      # repo's release workflow (not some other GHA workflow).
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.6.5'

      - name: Sign published image (keyless)
        env:
          # COSIGN_EXPERIMENTAL=1 is no longer required as of cosign 2.0,
          # but setting it explicitly documents the keyless flow for any
          # future maintainer reading this file.
          COSIGN_YES: "true"
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          # Sign by digest so each tag pointing at the same digest shares
          # one signature in Rekor. Iterate the tags only to provide
          # operator-friendly verify commands in the run log.
          for tag in $TAGS; do
            echo "Signing $tag@${DIGEST}"
            cosign sign --yes "${tag}@${DIGEST}"
          done

  helm-package:
    name: Package & Push Helm Chart
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      packages: write
      # OIDC token for cosign keyless signing of the OCI Helm chart.
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ github.event.workflow_run.head_branch }}"
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "VERSION=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      # Docker login writes creds to ~/.docker/config.json — cosign reads
      # from there. helm registry login alone writes only to the helm
      # config dir, leaving cosign unauthenticated against GHCR.
      - name: Log in to GHCR (Docker — for cosign)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR (Helm OCI)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} \
            --username ${{ github.actor }} \
            --password-stdin

      - name: Package Helm chart
        run: helm package ${{ env.HELM_CHART_PATH }} --version ${{ steps.version.outputs.VERSION }} --app-version ${{ steps.version.outputs.TAG }}

      - name: Push Helm chart to GHCR
        id: helm_push
        run: |
          CHART_FILE=$(ls sharko-*.tgz)
          # `helm push` writes a `.digest` companion in the working dir; we
          # capture the digest from stdout for the cosign sign step below.
          OUTPUT=$(helm push "$CHART_FILE" oci://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} 2>&1)
          echo "$OUTPUT"
          DIGEST=$(echo "$OUTPUT" | awk '/^Digest:/ {print $2}')
          if [ -z "$DIGEST" ]; then
            echo "::error::could not extract chart digest from helm push output"
            exit 1
          fi
          echo "DIGEST=$DIGEST" >> "$GITHUB_OUTPUT"

      # cosign-sign the OCI Helm chart so consumers can
      # `cosign verify oci://ghcr.io/moranweissman/sharko:vX.Y.Z` before
      # `helm install`. Same identity policy as the image signing step.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.6.5'

      - name: Sign published Helm chart (keyless)
        env:
          COSIGN_YES: "true"
          DIGEST: ${{ steps.helm_push.outputs.DIGEST }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/sharko:${VERSION}"
          # Sign by digest, same rationale as the image signing step.
          echo "Signing chart ${REF}@${DIGEST}"
          cosign sign --yes "${REF}@${DIGEST}"

  # v4 Wave 1 Story 2.4 — publish the sharko-engine chart (charts/sharko-engine)
  # as a signed OCI artifact, same registry namespace and same
  # package/push/sign shape as the helm-package job above for the sharko
  # chart. Kept as its OWN job (own checkout, own working directory)
  # rather than an extra step in helm-package: that job's
  # `CHART_FILE=$(ls sharko-*.tgz)` glob would otherwise also match
  # `sharko-engine-<version>.tgz` in the same workspace and break the
  # existing chart's push.
  #
  # Chart-version rule (review fix, v4 Wave 1 R2 — supersedes the original
  # Story 2.4 rule): the engine chart versions INDEPENDENTLY of the product
  # release tag. This job packages and pushes charts/sharko-engine's own
  # COMMITTED Chart.yaml `version:`/`appVersion:` fields — never an
  # override. Why: `internal/engineversion/generated.go` (kept in lockstep
  # with Chart.yaml by the "Engine Version Up To Date" CI job) is the
  # number a user's engine pin-bump check compares against, so the
  # published OCI tag MUST equal that committed number. The original rule
  # (publish under the product's own release tag) would have meant the
  # very first release's chart lived at a version nothing on disk ever
  # points to — a day-zero break. Most product releases do not touch
  # charts/sharko-engine/, so most releases have nothing new to publish
  # here; the "Check if engine chart version already published" step below
  # makes that a loud, idempotent skip instead of an error on a duplicate
  # OCI tag (see charts/sharko-engine/README.md for the full versioning
  # rule).
  helm-package-engine:
    name: Package & Push Engine Chart
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      packages: write
      # OIDC token for cosign keyless signing of the OCI Helm chart.
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      # Docker login writes creds to ~/.docker/config.json — cosign reads
      # from there. helm registry login alone writes only to the helm
      # config dir, leaving cosign unauthenticated against GHCR.
      - name: Log in to GHCR (Docker — for cosign)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR (Helm OCI)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} \
            --username ${{ github.actor }} \
            --password-stdin

      # Reads the chart's own COMMITTED version (never an override — see
      # the chart-version rule comment on this job above) and checks
      # whether that exact version is already published to GHCR. Most
      # releases don't touch charts/sharko-engine/, so this is the common
      # case, not the exception: skip loudly (::notice::) rather than
      # attempting a redundant push/sign of an unchanged artifact.
      - name: Check if engine chart version already published
        id: check
        run: |
          CHART_VERSION=$(helm show chart charts/sharko-engine | awk -F': *' '/^version:/ {print $2}')
          if [ -z "$CHART_VERSION" ]; then
            echo "::error::could not read version from charts/sharko-engine/Chart.yaml"
            exit 1
          fi
          echo "CHART_VERSION=$CHART_VERSION" >> "$GITHUB_OUTPUT"
          if helm show chart "oci://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/sharko-engine" --version "$CHART_VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::sharko-engine chart version $CHART_VERSION is already published to GHCR — skipping republish (idempotent; the engine chart versions independently of the product release tag, see charts/sharko-engine/README.md)."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package engine Helm chart
        if: steps.check.outputs.exists != 'true'
        run: helm package charts/sharko-engine

      - name: Push engine Helm chart to GHCR
        id: helm_push
        if: steps.check.outputs.exists != 'true'
        run: |
          CHART_FILE=$(ls sharko-engine-*.tgz)
          # `helm push` writes a `.digest` companion in the working dir; we
          # capture the digest from stdout for the cosign sign step below.
          OUTPUT=$(helm push "$CHART_FILE" oci://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} 2>&1)
          echo "$OUTPUT"
          DIGEST=$(echo "$OUTPUT" | awk '/^Digest:/ {print $2}')
          if [ -z "$DIGEST" ]; then
            echo "::error::could not extract engine chart digest from helm push output"
            exit 1
          fi
          echo "DIGEST=$DIGEST" >> "$GITHUB_OUTPUT"

      # cosign-sign the OCI Helm chart so consumers can
      # `cosign verify oci://ghcr.io/moranweissman/sharko/sharko-engine:X.Y.Z`
      # before `helm pull` (no `v` prefix — the pushed OCI tag is the bare
      # chart version, e.g. `0.1.0`, not the release tag).
      # Same identity policy as the sharko chart's own signing step.
      - name: Install cosign
        if: steps.check.outputs.exists != 'true'
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.6.5'

      - name: Sign published engine Helm chart (keyless)
        if: steps.check.outputs.exists != 'true'
        env:
          COSIGN_YES: "true"
          DIGEST: ${{ steps.helm_push.outputs.DIGEST }}
          VERSION: ${{ steps.check.outputs.CHART_VERSION }}
        run: |
          REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/sharko-engine:${VERSION}"
          # Sign by digest, same rationale as the sharko chart's signing step.
          echo "Signing chart ${REF}@${DIGEST}"
          cosign sign --yes "${REF}@${DIGEST}"

  goreleaser:
    name: Release CLI Binaries
    runs-on: ubuntu-latest
    needs: [sign-catalog-entries, build-and-push, helm-package, helm-package-engine]
    permissions:
      contents: write
      # OIDC token for cosign keyless signing of every release archive
      # via the goreleaser `signs:` block.
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      # Same embed-swap as build-and-push — replace the on-disk catalog
      # with the signed copy so goreleaser-built CLI binaries also carry
      # the signed bytes via //go:embed. The bundles are then attached
      # to the GitHub release via .goreleaser.yaml's release.extra_files
      # glob.
      - name: Download signed catalog artifact
        uses: actions/download-artifact@v4
        with:
          name: signed-catalog
          path: _dist/catalog/

      - name: Use signed catalog for build
        # Same guard as the build-and-push job above — fail loud if the
        # signed catalog artifact is empty/truncated so the goreleaser
        # CLI archives never ship an empty //go:embed catalog. See the
        # build-and-push step's comment for the full rationale.
        run: |
          if [ ! -s _dist/catalog/addons.yaml.signed ]; then
            echo "::error::signed catalog is empty or missing"
            exit 1
          fi
          cp _dist/catalog/addons.yaml.signed catalog/addons.yaml

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.6.5'

      # HONESTY PASS: puts syft on PATH so .goreleaser.yaml's `sboms:`
      # block can shell out to it. GoReleaser doesn't bundle an SBOM
      # generator itself — it just calls whatever `cmd:` names.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      # V2-cleanup-57.1 — release notes carry the CI-verified ArgoCD
      # compatibility claim. The weekly argocd-matrix workflow maintains
      # ui/src/generated/argocd-tested-range.json; this step turns it
      # into a one-line header that .goreleaser.yaml's release.header
      # template reads via envOrDefault. If the file is absent or
      # malformed the line is simply empty — a release never blocks on
      # (and never invents) a compatibility claim.
      - name: Derive ArgoCD tested-range release-notes line
        run: |
          f=ui/src/generated/argocd-tested-range.json
          line=""
          if [ -s "$f" ]; then
            min=$(jq -r '.tested_min // empty' "$f" 2>/dev/null || true)
            max=$(jq -r '.tested_max // empty' "$f" 2>/dev/null || true)
            if [ -n "$min" ] && [ -n "$max" ]; then
              line="Tested with ArgoCD ${min}–${max}"
            fi
          fi
          # Heredoc delimiter form (multiline-safe) — a plain KEY=value
          # write to GITHUB_ENV breaks if the value ever contains a
          # newline; this is fine even if the "Tested with ArgoCD..."
          # line stays single-line forever.
          {
            echo "SHARKO_TESTED_ARGOCD_LINE<<SHARKO_ARGOCD_LINE_EOF"
            echo "$line"
            echo "SHARKO_ARGOCD_LINE_EOF"
          } >> "$GITHUB_ENV"
          echo "release-notes tested-range line: '${line}'"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          # The signed-catalog swap (see "Use signed catalog for build"
          # step above) and the bundle download mutate the workspace
          # before GoReleaser runs, so its default dirty-tree check
          # would refuse to release. --skip=validate tells GoReleaser
          # the dirty workspace is intentional. We keep --clean so the
          # dist/ output dir is still wiped between runs.
          # Ref: https://goreleaser.com/errors/dirty
          args: release --clean --skip=validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # COSIGN_YES suppresses the interactive prompt in non-TTY mode.
          COSIGN_YES: "true"
