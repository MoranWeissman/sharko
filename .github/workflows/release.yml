name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: moranweissman/sharko
  HELM_CHART_PATH: charts/sharko

jobs:
  # cosign-keyless signs every entry in catalog/addons.yaml BEFORE the
  # binary builds, so the embedded YAML inside the released image and
  # CLI archives carries `signature.bundle` URLs that point at release
  # assets uploaded later in the same workflow. The default trust policy
  # whitelists this workflow's cert SAN, so fresh installs see the
  # embedded catalog as Verified out of the box.
  sign-catalog-entries:
    name: Sign Catalog Entries
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC token for cosign keyless signing — Fulcio mints a short-lived
      # cert from this token; the cert SAN encodes the workflow ref pattern
      # the default trust policy regex matches.
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ github.event.workflow_run.head_branch }}"
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"

      - name: Sign catalog entries (cosign keyless)
        env:
          COSIGN_YES: "true"
        run: |
          TAG="${{ steps.version.outputs.TAG }}"
          BASE="https://github.com/MoranWeissman/sharko/releases/download/${TAG}"
          go run ./cmd/catalog-sign --out _dist/catalog --release-base-url "${BASE}"

      - name: Upload signed catalog + bundles as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: signed-catalog
          path: _dist/catalog/
          if-no-files-found: error
          retention-days: 7

  build-and-push:
    name: Build & Push Docker Image
    needs: sign-catalog-entries
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # id-token: write enables OIDC for cosign keyless signing — Fulcio
      # mints a short-lived cert from the GitHub Actions OIDC token, then
      # the signature is logged to the public Rekor transparency log. No
      # long-lived signing key to rotate.
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      # Pull the signed catalog produced by the sign-catalog-entries job
      # and overwrite catalog/addons.yaml on disk so `//go:embed
      # addons.yaml` bakes the signed bytes into the image. Mutation is
      # confined to this runner workspace; never committed back.
      - name: Download signed catalog artifact
        uses: actions/download-artifact@v4
        with:
          name: signed-catalog
          path: _dist/catalog/

      - name: Use signed catalog for build
        # Guard: a silently-empty signed catalog would still cp without
        # error, baking an empty //go:embed into the released image. The
        # explicit -s check fails the job loud at swap time so a bad
        # cosign-job artifact never ships in a release. The download
        # step's `if-no-files-found: error` covers the missing-file case;
        # this guard catches the truncated/empty-file case.
        run: |
          if [ ! -s _dist/catalog/addons.yaml.signed ]; then
            echo "::error::signed catalog is empty or missing"
            exit 1
          fi
          cp _dist/catalog/addons.yaml.signed catalog/addons.yaml

      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ github.event.workflow_run.head_branch }}"
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "VERSION=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.TAG }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.TAG }}
            type=semver,pattern=v{{version}},value=${{ steps.version.outputs.TAG }}
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU (cross-arch emulation)
        # buildx needs QEMU registered to cross-compile the alpine
        # final stage for arm64 on an amd64 runner. The heavy stages
        # (npm build, go build) cross-compile natively via
        # --platform=$BUILDPLATFORM in the Dockerfile and don't need
        # emulation; only the final alpine stage's `apk add` still runs
        # per-arch, which is cheap even under emulation — so we register
        # all standard binfmt handlers up front.
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          # Multi-arch: amd64 for traditional cloud nodes, arm64 for
          # Graviton/Ampere/Apple Silicon. buildx assembles a manifest
          # list under the same tag; cosign signs the manifest digest
          # once and the signature covers every per-arch image.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CACHE_BUST=${{ github.event.workflow_run.head_sha }}
            VERSION=${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          # ignore-error=true: on run 30956764008 (2026-08-04) the image
          # itself pushed fine (manifest push done, 9.1s) but the cache
          # export step then failed with "token has no writable scopes"
          # and buildx treated that as a hard build failure, skipping
          # every downstream release job (helm charts, CLI binaries)
          # even though the image was already live in the registry.
          # ignore-error keeps the speed-up when the cache write works
          # and stops the whole release from dying when it doesn't.
          cache-to: type=gha,mode=max,ignore-error=true

      # cosign keyless signing of the published image. Pins the OIDC
      # issuer + repo-scoped certificate identity so a future
      # `cosign verify` run can confirm the signature came from *this*
      # repo's release workflow (not some other GHA workflow).
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Sign published image (keyless)
        env:
          # COSIGN_EXPERIMENTAL=1 is no longer required as of cosign 2.0,
          # but setting it explicitly documents the keyless flow for any
          # future maintainer reading this file.
          COSIGN_YES: "true"
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          # Sign by digest so each tag pointing at the same digest shares
          # one signature in Rekor. Iterate the tags only to provide
          # operator-friendly verify commands in the run log.
          for tag in $TAGS; do
            echo "Signing $tag@${DIGEST}"
            cosign sign --yes "${tag}@${DIGEST}"
          done

  helm-package:
    name: Package & Push Helm Chart
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      packages: write
      # OIDC token for cosign keyless signing of the OCI Helm chart.
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ github.event.workflow_run.head_branch }}"
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "VERSION=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      # Docker login writes creds to ~/.docker/config.json — cosign reads
      # from there. helm registry login alone writes only to the helm
      # config dir, leaving cosign unauthenticated against GHCR.
      - name: Log in to GHCR (Docker — for cosign)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR (Helm OCI)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} \
            --username ${{ github.actor }} \
            --password-stdin

      - name: Package Helm chart
        run: helm package ${{ env.HELM_CHART_PATH }} --version ${{ steps.version.outputs.VERSION }} --app-version ${{ steps.version.outputs.TAG }}

      - name: Push Helm chart to GHCR
        id: helm_push
        run: |
          CHART_FILE=$(ls sharko-*.tgz)
          # `helm push` writes a `.digest` companion in the working dir; we
          # capture the digest from stdout for the cosign sign step below.
          OUTPUT=$(helm push "$CHART_FILE" oci://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} 2>&1)
          echo "$OUTPUT"
          DIGEST=$(echo "$OUTPUT" | awk '/^Digest:/ {print $2}')
          if [ -z "$DIGEST" ]; then
            echo "::error::could not extract chart digest from helm push output"
            exit 1
          fi
          echo "DIGEST=$DIGEST" >> "$GITHUB_OUTPUT"

      # cosign-sign the OCI Helm chart so consumers can
      # `cosign verify oci://ghcr.io/moranweissman/sharko:vX.Y.Z` before
      # `helm install`. Same identity policy as the image signing step.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Sign published Helm chart (keyless)
        env:
          COSIGN_YES: "true"
          DIGEST: ${{ steps.helm_push.outputs.DIGEST }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/sharko:${VERSION}"
          # Sign by digest, same rationale as the image signing step.
          echo "Signing chart ${REF}@${DIGEST}"
          cosign sign --yes "${REF}@${DIGEST}"

  # v4 Wave 1 Story 2.4 — publish the sharko-engine chart (charts/sharko-engine)
  # as a signed OCI artifact, same registry namespace and same
  # package/push/sign shape as the helm-package job above for the sharko
  # chart. Kept as its OWN job (own checkout, own working directory)
  # rather than an extra step in helm-package: that job's
  # `CHART_FILE=$(ls sharko-*.tgz)` glob would otherwise also match
  # `sharko-engine-<version>.tgz` in the same workspace and break the
  # existing chart's push.
  #
  # Chart-version rule (review fix, v4 Wave 1 R2 — supersedes the original
  # Story 2.4 rule): the engine chart versions INDEPENDENTLY of the product
  # release tag. This job packages and pushes charts/sharko-engine's own
  # COMMITTED Chart.yaml `version:`/`appVersion:` fields — never an
  # override. Why: `internal/engineversion/generated.go` (kept in lockstep
  # with Chart.yaml by the "Engine Version Up To Date" CI job) is the
  # number a user's engine pin-bump check compares against, so the
  # published OCI tag MUST equal that committed number. The original rule
  # (publish under the product's own release tag) would have meant the
  # very first release's chart lived at a version nothing on disk ever
  # points to — a day-zero break. Most product releases do not touch
  # charts/sharko-engine/, so most releases have nothing new to publish
  # here; the "Check if engine chart version already published" step below
  # makes that a loud, idempotent skip instead of an error on a duplicate
  # OCI tag (see charts/sharko-engine/README.md for the full versioning
  # rule).
  helm-package-engine:
    name: Package & Push Engine Chart
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      packages: write
      # OIDC token for cosign keyless signing of the OCI Helm chart.
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      # Docker login writes creds to ~/.docker/config.json — cosign reads
      # from there. helm registry login alone writes only to the helm
      # config dir, leaving cosign unauthenticated against GHCR.
      - name: Log in to GHCR (Docker — for cosign)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR (Helm OCI)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} \
            --username ${{ github.actor }} \
            --password-stdin

      # Reads the chart's own COMMITTED version (never an override — see
      # the chart-version rule comment on this job above) and checks
      # whether that exact version is already published to GHCR. Most
      # releases don't touch charts/sharko-engine/, so this is the common
      # case, not the exception: skip loudly (::notice::) rather than
      # attempting a redundant push/sign of an unchanged artifact.
      - name: Check if engine chart version already published
        id: check
        run: |
          CHART_VERSION=$(helm show chart charts/sharko-engine | awk -F': *' '/^version:/ {print $2}')
          if [ -z "$CHART_VERSION" ]; then
            echo "::error::could not read version from charts/sharko-engine/Chart.yaml"
            exit 1
          fi
          echo "CHART_VERSION=$CHART_VERSION" >> "$GITHUB_OUTPUT"
          if helm show chart "oci://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/sharko-engine" --version "$CHART_VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::sharko-engine chart version $CHART_VERSION is already published to GHCR — skipping republish (idempotent; the engine chart versions independently of the product release tag, see charts/sharko-engine/README.md)."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package engine Helm chart
        if: steps.check.outputs.exists != 'true'
        run: helm package charts/sharko-engine

      - name: Push engine Helm chart to GHCR
        id: helm_push
        if: steps.check.outputs.exists != 'true'
        run: |
          CHART_FILE=$(ls sharko-engine-*.tgz)
          # `helm push` writes a `.digest` companion in the working dir; we
          # capture the digest from stdout for the cosign sign step below.
          OUTPUT=$(helm push "$CHART_FILE" oci://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} 2>&1)
          echo "$OUTPUT"
          DIGEST=$(echo "$OUTPUT" | awk '/^Digest:/ {print $2}')
          if [ -z "$DIGEST" ]; then
            echo "::error::could not extract engine chart digest from helm push output"
            exit 1
          fi
          echo "DIGEST=$DIGEST" >> "$GITHUB_OUTPUT"

      # cosign-sign the OCI Helm chart so consumers can
      # `cosign verify oci://ghcr.io/moranweissman/sharko/sharko-engine:X.Y.Z`
      # before `helm pull` (no `v` prefix — the pushed OCI tag is the bare
      # chart version, e.g. `0.1.0`, not the release tag).
      # Same identity policy as the sharko chart's own signing step.
      - name: Install cosign
        if: steps.check.outputs.exists != 'true'
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Sign published engine Helm chart (keyless)
        if: steps.check.outputs.exists != 'true'
        env:
          COSIGN_YES: "true"
          DIGEST: ${{ steps.helm_push.outputs.DIGEST }}
          VERSION: ${{ steps.check.outputs.CHART_VERSION }}
        run: |
          REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/sharko-engine:${VERSION}"
          # Sign by digest, same rationale as the sharko chart's signing step.
          echo "Signing chart ${REF}@${DIGEST}"
          cosign sign --yes "${REF}@${DIGEST}"

  goreleaser:
    name: Release CLI Binaries
    runs-on: ubuntu-latest
    needs: [sign-catalog-entries, build-and-push, helm-package, helm-package-engine]
    permissions:
      contents: write
      # OIDC token for cosign keyless signing of every release archive
      # via the goreleaser `signs:` block.
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      # Same embed-swap as build-and-push — replace the on-disk catalog
      # with the signed copy so goreleaser-built CLI binaries also carry
      # the signed bytes via //go:embed. The bundles are then attached
      # to the GitHub release via .goreleaser.yaml's release.extra_files
      # glob.
      - name: Download signed catalog artifact
        uses: actions/download-artifact@v4
        with:
          name: signed-catalog
          path: _dist/catalog/

      - name: Use signed catalog for build
        # Same guard as the build-and-push job above — fail loud if the
        # signed catalog artifact is empty/truncated so the goreleaser
        # CLI archives never ship an empty //go:embed catalog. See the
        # build-and-push step's comment for the full rationale.
        run: |
          if [ ! -s _dist/catalog/addons.yaml.signed ]; then
            echo "::error::signed catalog is empty or missing"
            exit 1
          fi
          cp _dist/catalog/addons.yaml.signed catalog/addons.yaml

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      # HONESTY PASS: puts syft on PATH so .goreleaser.yaml's `sboms:`
      # block can shell out to it. GoReleaser doesn't bundle an SBOM
      # generator itself — it just calls whatever `cmd:` names.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      # V2-cleanup-57.1 — release notes carry the CI-verified ArgoCD
      # compatibility claim. The weekly argocd-matrix workflow maintains
      # ui/src/generated/argocd-tested-range.json; this step turns it
      # into a one-line header that .goreleaser.yaml's release.header
      # template reads via envOrDefault. If the file is absent or
      # malformed the line is simply empty — a release never blocks on
      # (and never invents) a compatibility claim.
      - name: Derive ArgoCD tested-range release-notes line
        run: |
          f=ui/src/generated/argocd-tested-range.json
          line=""
          if [ -s "$f" ]; then
            min=$(jq -r '.tested_min // empty' "$f" 2>/dev/null || true)
            max=$(jq -r '.tested_max // empty' "$f" 2>/dev/null || true)
            if [ -n "$min" ] && [ -n "$max" ]; then
              line="Tested with ArgoCD ${min}–${max}"
            fi
          fi
          # Heredoc delimiter form (multiline-safe) — a plain KEY=value
          # write to GITHUB_ENV breaks if the value ever contains a
          # newline; this is fine even if the "Tested with ArgoCD..."
          # line stays single-line forever.
          {
            echo "SHARKO_TESTED_ARGOCD_LINE<<SHARKO_ARGOCD_LINE_EOF"
            echo "$line"
            echo "SHARKO_ARGOCD_LINE_EOF"
          } >> "$GITHUB_ENV"
          echo "release-notes tested-range line: '${line}'"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          # The signed-catalog swap (see "Use signed catalog for build"
          # step above) and the bundle download mutate the workspace
          # before GoReleaser runs, so its default dirty-tree check
          # would refuse to release. --skip=validate tells GoReleaser
          # the dirty workspace is intentional. We keep --clean so the
          # dist/ output dir is still wiped between runs.
          # Ref: https://goreleaser.com/errors/dirty
          args: release --clean --skip=validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # COSIGN_YES suppresses the interactive prompt in non-TTY mode.
          COSIGN_YES: "true"
