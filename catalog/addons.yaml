  - name: keptn
    description: Cloud-native lifecycle observability + SRE automation.
    chart: keptn
    repo: https://charts.lifecycle.keptn.sh
    default_namespace: keptn-system
    docs_url: https://keptn.sh/stable/docs/
    homepage: https://keptn.sh/
    source_url: https://github.com/keptn/lifecycle-toolkit
    maintainers: [keptn]
    license: Apache-2.0
    category: developer-tools
    curated_by: [cncf-incubating, artifacthub-verified]
    security_score: unknown
    github_stars: 1500
    min_kubernetes_version: "1.26"
    secrets:
      - name: Integration API tokens
        description: Tokens for whichever CI/CD and observability tools you wire in as lifecycle-toolkit integrations — none are needed for a minimal install.
