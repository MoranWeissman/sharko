# ---------------------------------------------------------------------------
# Sharko catalog — curated addon metadata (v1.21+)
#
# This file is embedded into the Sharko binary via //go:embed at build time
# (see internal/catalog/embed.go). It ships the curated short-list that backs
# the Marketplace "Browse" tab. Contributions: PR into this file, CODEOWNERS-
# gated, validated by the catalog-validate CI workflow (v1.21 Epic 8).
#
# Inclusion criterion: entry appears in 2+ curation sources from §7 of the
# v1.21 design doc (CNCF landscape, AWS EKS Blueprints, Azure AKS add-ons,
# GKE Marketplace, ArtifactHub verified publishers, OpenSSF Scorecard).
#
# Refresh values:
#   - security_score: OpenSSF Scorecard aggregate 0-10; "unknown" is allowed
#     and is overwritten in-memory by the daily Scorecard refresh job
#     (internal/catalog/scorecard.go) once Sharko boots.
#   - github_stars: round-number approximations; refreshed by the same daily
#     job in-memory (not written back to this file).
#
# v4 wave 1 Story 3.1 ("extended entries"): required_values, secrets, and
# quirks are the addon's operational knowledge — what a person needs to
# know to actually run it, in plain English. All three are optional (many
# addons need none of them) and deliberately unstructured free text, NOT a
# per-addon JSON Schema — see docs/design/2026-07-30-v4-data-file-format.md
# §2.3. This same file is also the single source for the v4 engine chart's
# shipped catalog (design doc §4.7) — the chart's copy is generated from
# this file at build time (Story 2.4's wiring), so entries here are read by
# both the v3 Marketplace browse screen and the v4 engine.
#
# Schema: see catalog/schema.json (reference) and the CatalogEntry struct in
# internal/catalog/loader.go (enforced).
# ---------------------------------------------------------------------------

addons:

  # -------------------- Security --------------------

  - name: cert-manager
    description: Automated TLS certificate lifecycle management for Kubernetes.
    chart: cert-manager
    repo: https://charts.jetstack.io                  # verified: cert-manager@v1.20.2 present
    default_namespace: cert-manager
    docs_url: https://cert-manager.io/docs
    homepage: https://cert-manager.io
    source_url: https://github.com/cert-manager/cert-manager
    maintainers: [jetstack]
    license: Apache-2.0
    category: security
    curated_by: [cncf-graduated, aws-eks-blueprints, artifacthub-verified]
    security_score: unknown
    github_stars: 12500
    min_kubernetes_version: "1.23"
    required_values:
      - key: installCRDs
        description: Set to true so the chart installs cert-manager's own CRDs; otherwise apply them separately before installing.
    secrets:
      - name: DNS provider API credentials
        description: Only needed if you configure a DNS-01 ClusterIssuer (e.g. Route53, Cloudflare) after install — the chart itself needs no secret to run.
        required_for: runtime
    quirks:
      - "The webhook's CA bundle is rewritten on every reconcile — ignore admissionregistration.k8s.io/ValidatingWebhookConfiguration's caBundle field in Argo CD or every sync looks dirty."

  - name: external-dns
    description: Configure external DNS records from Kubernetes ingresses and services.
    chart: external-dns
    repo: https://kubernetes-sigs.github.io/external-dns/
    default_namespace: external-dns
    docs_url: https://kubernetes-sigs.github.io/external-dns/
    homepage: https://github.com/kubernetes-sigs/external-dns
    source_url: https://github.com/kubernetes-sigs/external-dns
    maintainers: [kubernetes-sigs]
    license: Apache-2.0
    category: security
    curated_by: [cncf-incubating, aws-eks-blueprints, artifacthub-verified]
    security_score: unknown
    github_stars: 7800
    min_kubernetes_version: "1.23"
    required_values:
      - key: provider
        description: Which DNS provider to target (aws, cloudflare, google, azure, ...) — there is no default.
      - key: domainFilters
        description: Restricts which DNS zones it is allowed to manage. Without this it tries to manage every zone the credentials can see.
      - key: txtOwnerId
        description: A unique tag written into managed records so multiple clusters or environments sharing a zone don't fight over the same records.
    secrets:
      - name: DNS provider credentials
        description: Credentials for the chosen provider's API (e.g. an AWS IAM role for Route53, or a Cloudflare API token) — usually wired via IRSA/workload identity rather than a literal Secret.
    quirks:
      - "Without domainFilters set, it will try to manage every zone its credentials can see — scope it before turning it on in a shared cloud account."

  - name: external-secrets
    description: Sync secrets from external managers (AWS SM, Vault, GCP SM, Azure KV, …) into Kubernetes.
    chart: external-secrets
    repo: https://charts.external-secrets.io
    default_namespace: external-secrets
    docs_url: https://external-secrets.io/
    homepage: https://external-secrets.io/
    source_url: https://github.com/external-secrets/external-secrets
    maintainers: [external-secrets-io]
    license: Apache-2.0
    category: security
    curated_by: [cncf-graduated, aws-eks-blueprints, artifacthub-verified]
    security_score: unknown
    github_stars: 5000
    min_kubernetes_version: "1.23"
    secrets:
      - name: Backend secret-manager credentials
        description: Credentials for whichever external secret manager you point a SecretStore/ClusterSecretStore at (AWS SM, Vault, GCP SM, Azure KV) — supplied on that CRD, not on this chart's values.
        required_for: runtime
    quirks:
      - "The chart only installs the operator — you still create a SecretStore or ClusterSecretStore CRD pointing at your real secret manager before anything actually syncs."

  - name: sealed-secrets
    description: Encrypt Kubernetes Secrets so they can be stored safely in Git.
    chart: sealed-secrets
    repo: https://bitnami-labs.github.io/sealed-secrets
    default_namespace: kube-system
    docs_url: https://github.com/bitnami-labs/sealed-secrets
    homepage: https://sealed-secrets.netlify.app/
    source_url: https://github.com/bitnami-labs/sealed-secrets
    maintainers: [bitnami-labs]
    license: Apache-2.0
    category: security
    curated_by: [cncf-sandbox, artifacthub-verified]
    security_score: unknown
    github_stars: 7500
    min_kubernetes_version: "1.22"
    quirks:
      - "The private sealing key is generated in-cluster on first start and lives only there unless you back it up — losing it makes every previously-sealed secret unrecoverable."

  - name: kyverno
    description: Kubernetes-native policy management — validation, mutation, generation, and image verification.
    chart: kyverno
    repo: https://kyverno.github.io/kyverno/           # verified: kyverno@3.x present
    default_namespace: kyverno
    docs_url: https://kyverno.io/docs/
    homepage: https://kyverno.io
    source_url: https://github.com/kyverno/kyverno
    maintainers: [kyverno]
    license: Apache-2.0
    category: security
    curated_by: [cncf-incubating, aws-eks-blueprints, artifacthub-verified]
    security_score: unknown
    github_stars: 5800
    min_kubernetes_version: "1.25"
    quirks:
      - "A large policy set can push its admission-webhook CRDs past Kubernetes' 262144-byte annotation limit — needs ServerSideApply=true (see the v4 settings schema, design doc §3.2) once policies grow."

  - name: gatekeeper
    description: Policy controller for Kubernetes built on OPA, constraint templates + constraints.
    chart: gatekeeper
    repo: https://open-policy-agent.github.io/gatekeeper/charts
    default_namespace: gatekeeper-system
    docs_url: https://open-policy-agent.github.io/gatekeeper/website/docs/
    homepage: https://open-policy-agent.github.io/gatekeeper/
    source_url: https://github.com/open-policy-agent/gatekeeper
    maintainers: [open-policy-agent]
    license: Apache-2.0
    category: security
    curated_by: [cncf-graduated, aws-eks-blueprints]
    security_score: unknown
    github_stars: 3800
    min_kubernetes_version: "1.24"
    quirks:
      - "Constraint templates and constraints are cluster-scoped CRDs — removing the addon does not remove your policies; clean those up separately."

  - name: trivy-operator
    description: Scans cluster workloads for vulnerabilities, misconfigurations, and exposed secrets.
    chart: trivy-operator
    repo: https://aquasecurity.github.io/helm-charts/
    default_namespace: trivy-system
    docs_url: https://aquasecurity.github.io/trivy-operator/
    homepage: https://github.com/aquasecurity/trivy-operator
    source_url: https://github.com/aquasecurity/trivy-operator
    maintainers: [aquasecurity]
    license: Apache-2.0
    category: security
    curated_by: [artifacthub-verified]
    security_score: unknown
    github_stars: 1400
    min_kubernetes_version: "1.23"
    secrets:
      - name: Private registry pull credentials
        description: Only needed to scan images in a private registry — reuses the imagePullSecrets already on the workloads being scanned.
    quirks:
      - "Runs a scan Job per workload on a schedule — expect a burst of short-lived pods across every namespace right after install."

  - name: falco
    description: Runtime security monitoring using kernel events + rules.
    chart: falco
    repo: https://falcosecurity.github.io/charts
    default_namespace: falco
    docs_url: https://falco.org/docs/
    homepage: https://falco.org
    source_url: https://github.com/falcosecurity/falco
    maintainers: [falcosecurity]
    license: Apache-2.0
    category: security
    curated_by: [cncf-graduated, artifacthub-verified]
    security_score: unknown
    github_stars: 7300
    min_kubernetes_version: "1.23"
    required_values:
      - key: driver.kind
        description: Chooses the kernel driver (eBPF probe vs. kernel module) — must match your node's kernel and OS image, so check this before enabling it fleet-wide.
    quirks:
      - "Needs a kernel driver matched to your node's kernel — a mismatch means the DaemonSet crash-loops instead of degrading gracefully."

  - name: vault
    description: HashiCorp Vault — secret management, encryption-as-a-service, identity-based access.
    chart: vault
    repo: https://helm.releases.hashicorp.com
    default_namespace: vault
    docs_url: https://developer.hashicorp.com/vault/docs
    homepage: https://www.vaultproject.io/
    source_url: https://github.com/hashicorp/vault
    maintainers: [hashicorp]
    license: BUSL-1.1                                  # flag for license review (non-OSI)
    category: security
    curated_by: [artifacthub-verified]
    security_score: unknown
    github_stars: 31000
    min_kubernetes_version: "1.23"
    required_values:
      - key: server.ha.enabled
        description: Whether to run Vault in HA (Raft) mode across multiple replicas, or a single standalone instance.
      - key: server.dataStorage
        description: The persistent volume Vault stores its data on — sizing and storage class matter here.
    secrets:
      - name: Unseal keys and root token
        description: Generated by you when you run `vault operator init` after install — Vault ships sealed and Sharko creates nothing here.
        required_for: runtime
    quirks:
      - "Ships sealed by default — you must run `vault operator init` and unseal it yourself (or wire auto-unseal) before it serves any traffic."

  # -------------------- Observability --------------------

  - name: kube-prometheus-stack
    description: Full Prometheus + Alertmanager + Grafana + node/kube-state metrics stack.
    chart: kube-prometheus-stack
    repo: https://prometheus-community.github.io/helm-charts   # verified: repo + alertmanager present
    default_namespace: monitoring
    docs_url: https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack
    homepage: https://prometheus.io/
    source_url: https://github.com/prometheus-community/helm-charts
    maintainers: [prometheus-community]
    license: Apache-2.0
    category: observability
    curated_by: [cncf-graduated, aws-eks-blueprints, artifacthub-verified]
    security_score: unknown
    github_stars: 5400
    min_kubernetes_version: "1.24"
    required_values:
      - key: prometheus.prometheusSpec.retention
        description: How long metrics are kept before eviction — the default is short; size it for your actual dashboards/alerting window.
      - key: grafana.adminPassword
        description: Set explicitly, or Grafana generates a random one only visible in its initial Secret.
    quirks:
      - "Ships its own CRDs (Prometheus, Alertmanager, ServiceMonitor) — installing a second copy of those CRDs elsewhere in the same cluster collides with this one."

  - name: grafana
    description: Grafana visualization platform for metrics, logs, and traces.
    chart: grafana
    repo: https://grafana.github.io/helm-charts         # verified: repo lists many charts
    default_namespace: monitoring
    docs_url: https://grafana.com/docs/grafana/latest/
    homepage: https://grafana.com/
    source_url: https://github.com/grafana/grafana
    maintainers: [grafana]
    license: AGPL-3.0                                   # flag for license review
    category: observability
    curated_by: [cncf-incubating, aws-eks-blueprints, artifacthub-verified]
    security_score: unknown
    github_stars: 65000
    min_kubernetes_version: "1.24"
    required_values:
      - key: adminPassword
        description: Set explicitly, or a random admin password is generated and only visible in the pod's initial Secret.
    quirks:
      - "AGPL-3.0 licensed — some organizations' license-review policy flags this before it can roll out broadly."

  - name: loki
    description: Prometheus-inspired log aggregation system; cheap, index-light, label-based.
    chart: loki
    repo: https://grafana.github.io/helm-charts
    default_namespace: monitoring
    docs_url: https://grafana.com/docs/loki/latest/
    homepage: https://grafana.com/oss/loki/
    source_url: https://github.com/grafana/loki
    maintainers: [grafana]
    license: AGPL-3.0
    category: observability
    curated_by: [cncf-incubating, artifacthub-verified]
    security_score: unknown
    github_stars: 24000
    min_kubernetes_version: "1.24"
    required_values:
      - key: loki.storage
        description: Which object store backend holds log chunks (S3, GCS, filesystem, ...) — filesystem storage does not survive pod restarts in most setups.
    secrets:
      - name: Object storage credentials
        description: Credentials for the configured backend (S3/GCS access key or IRSA) — not needed for filesystem storage.
    quirks:
      - "The default single-binary deployment mode is fine for small clusters but doesn't scale — production installs need the distributed (simple-scalable) mode."

  - name: tempo
    description: Grafana Tempo — high-volume distributed tracing backend.
    chart: tempo
    repo: https://grafana.github.io/helm-charts
    default_namespace: monitoring
    docs_url: https://grafana.com/docs/tempo/latest/
    homepage: https://grafana.com/oss/tempo/
    source_url: https://github.com/grafana/tempo
    maintainers: [grafana]
    license: AGPL-3.0
    category: observability
    curated_by: [cncf-incubating, artifacthub-verified]
    security_score: unknown
    github_stars: 4400
    min_kubernetes_version: "1.24"
    required_values:
      - key: storage.trace.backend
        description: Which object store backend holds trace data (S3, GCS, filesystem, ...), same shape as Loki's storage config.
    secrets:
      - name: Object storage credentials
        description: Credentials for the configured backend — not needed for local/filesystem storage.
    quirks:
      - "Needs a trace source actually sending spans (e.g. an OpenTelemetry Collector) — installed alone it's an empty backend with nothing to query."

  - name: opentelemetry-operator
    description: Manages OpenTelemetry Collector deployments + auto-instrumentation in Kubernetes.
    chart: opentelemetry-operator
    repo: https://open-telemetry.github.io/opentelemetry-helm-charts
    default_namespace: opentelemetry-operator-system
    docs_url: https://opentelemetry.io/docs/kubernetes/operator/
    homepage: https://opentelemetry.io/
    source_url: https://github.com/open-telemetry/opentelemetry-operator
    maintainers: [open-telemetry]
    license: Apache-2.0
    category: observability
    curated_by: [cncf-graduated, artifacthub-verified]
    security_score: unknown
    github_stars: 1400
    min_kubernetes_version: "1.23"
    quirks:
      - "Only installs the operator and CRDs — you still create an OpenTelemetryCollector CR to actually run a collector."

  - name: jaeger
    description: Distributed tracing backend, end-to-end request flow across microservices.
    chart: jaeger
    repo: https://jaegertracing.github.io/helm-charts
    default_namespace: observability
    docs_url: https://www.jaegertracing.io/docs/
    homepage: https://www.jaegertracing.io/
    source_url: https://github.com/jaegertracing/jaeger
    maintainers: [jaegertracing]
    license: Apache-2.0
    category: observability
    curated_by: [cncf-graduated, artifacthub-verified]
    security_score: unknown
    github_stars: 20000
    min_kubernetes_version: "1.23"
    required_values:
      - key: storage.type
        description: Storage backend for traces — the default in-memory backend loses everything on restart; use Elasticsearch or Cassandra for anything beyond a demo.
    secrets:
      - name: Storage backend credentials
        description: Credentials for Elasticsearch/Cassandra when you configure a real storage backend.
    quirks:
      - "Default in-memory storage discards all traces on pod restart — fine for a demo, not for production."

  - name: fluent-bit
    description: Lightweight log processor and forwarder — ships logs to Loki / Elasticsearch / S3 / etc.
    chart: fluent-bit
    repo: https://fluent.github.io/helm-charts
    default_namespace: logging
    docs_url: https://docs.fluentbit.io/
    homepage: https://fluentbit.io
    source_url: https://github.com/fluent/fluent-bit
    maintainers: [fluent]
    license: Apache-2.0
    category: observability
    curated_by: [cncf-graduated, aws-eks-blueprints, artifacthub-verified]
    security_score: unknown
    github_stars: 5800
    min_kubernetes_version: "1.22"
    required_values:
      - key: config.outputs
        description: Where collected logs actually ship to (Loki URL, Elasticsearch endpoint, S3 bucket, ...) — there is no default destination.
    secrets:
      - name: Log sink credentials
        description: Credentials for whichever downstream log sink you configure in config.outputs.
    quirks:
      - "Ships with no output backend configured — set config.outputs or it collects logs and quietly drops them."

  - name: kube-state-metrics
    description: Exposes metrics about the state of Kubernetes objects (deployments, pods, nodes, …).
    chart: kube-state-metrics
    repo: https://prometheus-community.github.io/helm-charts
    default_namespace: monitoring
    docs_url: https://github.com/kubernetes/kube-state-metrics
    homepage: https://github.com/kubernetes/kube-state-metrics
    source_url: https://github.com/kubernetes/kube-state-metrics
    maintainers: [kubernetes]
    license: Apache-2.0
    category: observability
    curated_by: [cncf-graduated, artifacthub-verified]
    security_score: unknown
    github_stars: 5300
    min_kubernetes_version: "1.23"
    quirks:
      - "Exposes cluster-wide object state on an unauthenticated metrics endpoint by default — restrict network access to it if that matters in your environment."

  - name: metrics-server
    description: Aggregates resource metrics (CPU/memory) for kubectl top + HPA.
    chart: metrics-server
    repo: https://kubernetes-sigs.github.io/metrics-server/
    default_namespace: kube-system
    docs_url: https://kubernetes-sigs.github.io/metrics-server/
    homepage: https://github.com/kubernetes-sigs/metrics-server
    source_url: https://github.com/kubernetes-sigs/metrics-server
    maintainers: [kubernetes-sigs]
    license: Apache-2.0
    category: observability
    curated_by: [cncf-graduated, aws-eks-blueprints, artifacthub-verified]
    security_score: unknown
    github_stars: 5900
    min_kubernetes_version: "1.23"
    quirks:
      - "On clusters with self-signed kubelet certificates (common on kind/k3s and some on-prem setups) it needs --kubelet-insecure-tls or it reports no metrics at all."

  # -------------------- Networking --------------------

  - name: ingress-nginx
    description: NGINX-based Kubernetes Ingress controller.
    chart: ingress-nginx
    repo: https://kubernetes.github.io/ingress-nginx
    default_namespace: ingress-nginx
    docs_url: https://kubernetes.github.io/ingress-nginx/
    homepage: https://kubernetes.github.io/ingress-nginx/
    source_url: https://github.com/kubernetes/ingress-nginx
    maintainers: [kubernetes]
    license: Apache-2.0
    category: networking
    curated_by: [cncf-graduated, aws-eks-blueprints, artifacthub-verified]
    security_score: unknown
    github_stars: 17500
    min_kubernetes_version: "1.25"
    required_values:
      - key: controller.service.type
        description: LoadBalancer on cloud clusters, NodePort (or hostNetwork) on bare-metal/on-prem — pick based on your infrastructure.
    secrets:
      - name: TLS certificate
        description: Only needed if you terminate TLS at this ingress by hand — usually cert-manager provisions and rotates this for you instead.
    quirks:
      - "Only one ingress controller per cluster should be marked the default ingress class — check controller.ingressClassResource.default before installing a second one."

  - name: traefik
    description: Cloud-native reverse proxy and ingress controller with automatic service discovery.
    chart: traefik
    repo: https://traefik.github.io/charts
    default_namespace: traefik
    docs_url: https://doc.traefik.io/traefik/
    homepage: https://traefik.io/traefik/
    source_url: https://github.com/traefik/traefik
    maintainers: [traefik]
    license: MIT
    category: networking
    curated_by: [cncf-incubating, artifacthub-verified]
    security_score: unknown
    github_stars: 52000
    min_kubernetes_version: "1.24"
    secrets:
      - name: TLS certificate
        description: Only needed if you're not using Traefik's built-in ACME/Let's Encrypt integration for certificates.
    quirks:
      - "Its own CRDs (IngressRoute, Middleware) are a separate API from core Kubernetes Ingress — mixing both styles in one cluster gets confusing fast."

  - name: cilium
    description: eBPF-based networking, observability, and security (CNI, L4/L7 policy, service mesh).
    chart: cilium
    repo: https://helm.cilium.io/
    default_namespace: kube-system
    docs_url: https://docs.cilium.io/
    homepage: https://cilium.io/
    source_url: https://github.com/cilium/cilium
    maintainers: [cilium]
    license: Apache-2.0
    category: networking
    curated_by: [cncf-graduated, artifacthub-verified]
    security_score: unknown
    github_stars: 21000
    min_kubernetes_version: "1.23"
    required_values:
      - key: kubeProxyReplacement
        description: Whether Cilium replaces kube-proxy entirely — a decision that's hard to change once workloads are running on top of it.
      - key: ipam.mode
        description: The IP address management mode (cluster-pool, kubernetes, ENI, ...) — depends on your cloud/network setup.
    quirks:
      - "Best installed as the CNI at cluster bootstrap — swapping it in as a day-2 add-on on a cluster already running another CNI needs a careful, node-by-node migration."

  - name: istio
    description: Service mesh — traffic management, observability, security, policy.
    chart: istiod
    repo: https://istio-release.storage.googleapis.com/charts
    default_namespace: istio-system
    docs_url: https://istio.io/latest/docs/
    homepage: https://istio.io
    source_url: https://github.com/istio/istio
    maintainers: [istio]
    license: Apache-2.0
    category: networking
    curated_by: [cncf-graduated, azure-aks-addon, artifacthub-verified]
    security_score: unknown
    github_stars: 36000
    min_kubernetes_version: "1.26"
    quirks:
      - "This chart installs istiod only — the ingress/egress gateways and sidecar injection are separate charts and steps layered on top."

  - name: linkerd
    description: Lightweight, security-focused service mesh.
    chart: linkerd-control-plane
    repo: https://helm.linkerd.io/stable
    default_namespace: linkerd
    docs_url: https://linkerd.io/2/overview/
    homepage: https://linkerd.io
    source_url: https://github.com/linkerd/linkerd2
    maintainers: [linkerd]
    license: Apache-2.0
    category: networking
    curated_by: [cncf-graduated, artifacthub-verified]
    security_score: unknown
    github_stars: 10700
    min_kubernetes_version: "1.23"
    secrets:
      - name: Trust anchor and issuer certificate
        description: The mTLS trust anchor + issuer cert/key pair Linkerd needs before the control plane will start — you generate and supply this; there is no auto-generated default.
    quirks:
      - "Needs its trust anchor and issuer certificate generated and supplied up front — unlike some meshes there's no built-in self-signed default to fall back on."

  - name: metallb
    description: Bare-metal load-balancer for Kubernetes — L2 / BGP modes.
    chart: metallb
    repo: https://metallb.github.io/metallb
    default_namespace: metallb-system
    docs_url: https://metallb.universe.tf/
    homepage: https://metallb.universe.tf/
    source_url: https://github.com/metallb/metallb
    maintainers: [metallb]
    license: Apache-2.0
    category: networking
    curated_by: [artifacthub-verified]
    security_score: unknown
    github_stars: 7100
    min_kubernetes_version: "1.22"
    required_values:
      - key: (post-install) IPAddressPool CR
        description: A separate custom resource (not a chart value) defining the IP range MetalLB may hand out — the chart alone allocates nothing.
    quirks:
      - "Only useful on bare-metal/on-prem clusters that don't already have a cloud load balancer — running it alongside a cloud LB controller usually isn't what you want."

  - name: haproxy-ingress
    description: HAProxy-based ingress controller.
    chart: haproxy-ingress
    repo: https://haproxy-ingress.github.io/charts
    default_namespace: ingress-controller
    docs_url: https://haproxy-ingress.github.io/docs/
    homepage: https://haproxy-ingress.github.io/
    source_url: https://github.com/jcmoraisjr/haproxy-ingress
    maintainers: [haproxy-ingress]
    license: Apache-2.0
    category: networking
    curated_by: [artifacthub-verified]
    security_score: unknown
    github_stars: 1100
    min_kubernetes_version: "1.22"
    required_values:
      - key: controller.service.type
        description: LoadBalancer on cloud clusters, NodePort/hostNetwork on bare-metal — matches your infrastructure.
    quirks:
      - "Configuration reloads restart HAProxy's connection tables briefly — expect brief connection resets right after an ingress-annotation change."

  # -------------------- Autoscaling / Scheduling --------------------

  - name: karpenter
    description: Just-in-time node provisioning; fast and workload-aware autoscaling (AWS / Azure providers).
    chart: karpenter
    repo: oci://public.ecr.aws/karpenter
    default_namespace: karpenter
    docs_url: https://karpenter.sh/docs/
    homepage: https://karpenter.sh
    source_url: https://github.com/aws/karpenter-provider-aws
    maintainers: [aws]
    license: Apache-2.0
    category: autoscaling
    curated_by: [aws-eks-blueprints, artifacthub-verified]
    security_score: unknown
    github_stars: 6900
    min_kubernetes_version: "1.25"
    required_values:
      - key: settings.clusterName
        description: The EKS cluster name Karpenter provisions nodes for — required, no default.
      - key: settings.clusterEndpoint
        description: The cluster's API server endpoint, so newly-launched nodes can join it.
    secrets:
      - name: Controller IAM role (IRSA)
        description: An IAM role with EC2/Auto Scaling permissions to launch and terminate instances — required before it can provision a single node.
    quirks:
      - "AWS/Azure only — there's no generic cloud-agnostic mode, and it does nothing useful until its controller IAM role has real EC2 permissions."

  - name: cluster-autoscaler
    description: Scales Kubernetes nodes up/down based on pending pods (cloud-provider-aware).
    chart: cluster-autoscaler
    repo: https://kubernetes.github.io/autoscaler
    default_namespace: kube-system
    docs_url: https://github.com/kubernetes/autoscaler/tree/master/cluster-autoscaler
    homepage: https://github.com/kubernetes/autoscaler
    source_url: https://github.com/kubernetes/autoscaler
    maintainers: [kubernetes]
    license: Apache-2.0
    category: autoscaling
    curated_by: [cncf-graduated, aws-eks-blueprints, artifacthub-verified]
    security_score: unknown
    github_stars: 8200
    min_kubernetes_version: "1.23"
    required_values:
      - key: autoDiscovery.clusterName
        description: Names the cluster whose node groups/ASGs cluster-autoscaler is allowed to scale.
      - key: cloudProvider
        description: Which cloud provider's node-group API to call (aws, gce, azure, ...).
    secrets:
      - name: Cloud IAM credentials
        description: Permission to scale the discovered node groups (IRSA on EKS, workload identity on GKE, a managed identity on AKS).
    quirks:
      - "Node group discovery depends on your cloud's ASG/node-pool tagging convention — untagged groups are silently invisible to it."

  - name: keda
    description: Kubernetes Event-Driven Autoscaling — scale workloads based on events from any source.
    chart: keda
    repo: https://kedacore.github.io/charts
    default_namespace: keda
    docs_url: https://keda.sh/docs/
    homepage: https://keda.sh/
    source_url: https://github.com/kedacore/keda
    maintainers: [kedacore]
    license: Apache-2.0
    category: autoscaling
    curated_by: [cncf-graduated, azure-aks-addon, aws-eks-blueprints, artifacthub-verified]
    security_score: unknown
    github_stars: 8700
    min_kubernetes_version: "1.27"
    secrets:
      - name: Event source credentials
        description: Credentials for whichever queue/broker/metric you scale on — supplied via the ScaledObject's TriggerAuthentication, not chart values.
        required_for: runtime
    quirks:
      - "CRDs exceed Kubernetes' 262144-byte annotation limit on larger clusters — needs ServerSideApply=true, same requirement as Kyverno (design doc §3.2)."

  - name: vertical-pod-autoscaler
    description: Recommends and applies CPU / memory requests/limits based on observed usage.
    chart: vertical-pod-autoscaler
    repo: https://cowboysysop.github.io/charts/
    default_namespace: vpa-system
    docs_url: https://github.com/kubernetes/autoscaler/tree/master/vertical-pod-autoscaler
    homepage: https://github.com/kubernetes/autoscaler
    source_url: https://github.com/kubernetes/autoscaler
    maintainers: [cowboysysop]
    license: Apache-2.0
    category: autoscaling
    curated_by: [aws-eks-blueprints, artifacthub-verified]
    security_score: unknown
    github_stars: 8200
    min_kubernetes_version: "1.24"
    required_values:
      - key: (per-workload) updateMode
        description: Set on each VerticalPodAutoscaler CR you create (Off/Initial/Auto) — the chart alone just installs the components and recommends nothing on its own.
    quirks:
      - "In Auto mode it evicts and restarts pods to apply new resource requests — don't enable that mode for anything that can't tolerate a restart."

  - name: descheduler
    description: Evicts pods so the scheduler can reschedule them for better balance.
    chart: descheduler
    repo: https://kubernetes-sigs.github.io/descheduler/
    default_namespace: kube-system
    docs_url: https://github.com/kubernetes-sigs/descheduler
    homepage: https://github.com/kubernetes-sigs/descheduler
    source_url: https://github.com/kubernetes-sigs/descheduler
    maintainers: [kubernetes-sigs]
    license: Apache-2.0
    category: autoscaling
    curated_by: [artifacthub-verified]
    security_score: unknown
    github_stars: 4200
    min_kubernetes_version: "1.25"
    required_values:
      - key: deschedulerPolicy
        description: Which strategies run and on what schedule (e.g. LowNodeUtilization) — the defaults are conservative but worth reviewing before enabling fleet-wide.
    quirks:
      - "Evicts pods to rebalance the cluster — a workload with no PodDisruptionBudget can be evicted repeatedly with nothing to protect it."

  # -------------------- GitOps / CI --------------------

  - name: argocd
    description: Declarative GitOps continuous delivery for Kubernetes.
    chart: argo-cd
    repo: https://argoproj.github.io/argo-helm
    default_namespace: argocd
    docs_url: https://argo-cd.readthedocs.io/
    homepage: https://argo-cd.readthedocs.io/
    source_url: https://github.com/argoproj/argo-cd
    maintainers: [argoproj]
    license: Apache-2.0
    category: gitops
    curated_by: [cncf-graduated, aws-eks-blueprints, artifacthub-verified]
    security_score: unknown
    github_stars: 19000
    min_kubernetes_version: "1.25"
    secrets:
      - name: Initial admin password
        description: Auto-generated into a Secret on first install — rotate it before exposing the UI/API beyond the cluster.
    quirks:
      - "Using this addon to run Argo CD to manage Argo CD (self-management) works but needs care — a broken sync of its own Application can leave it unable to fix itself."

  - name: argo-workflows
    description: Workflow engine for Kubernetes — pipelines as DAGs of containerized steps.
    chart: argo-workflows
    repo: https://argoproj.github.io/argo-helm
    default_namespace: argo
    docs_url: https://argo-workflows.readthedocs.io/
    homepage: https://argoproj.github.io/workflows/
    source_url: https://github.com/argoproj/argo-workflows
    maintainers: [argoproj]
    license: Apache-2.0
    category: gitops
    curated_by: [cncf-graduated, aws-eks-blueprints, artifacthub-verified]
    security_score: unknown
    github_stars: 15000
    min_kubernetes_version: "1.25"
    secrets:
      - name: Artifact repository credentials
        description: S3/GCS credentials if you configure workflow artifact storage — not needed to run workflows without artifact passing.
    quirks:
      - "Ships with the UI/API server in a permissive auth mode by default — set server.authModes before exposing it outside the cluster."

  - name: argo-rollouts
    description: Progressive delivery — blue-green, canary, analysis, experimentation.
    chart: argo-rollouts
    repo: https://argoproj.github.io/argo-helm
    default_namespace: argo-rollouts
    docs_url: https://argo-rollouts.readthedocs.io/
    homepage: https://argoproj.github.io/argo-rollouts/
    source_url: https://github.com/argoproj/argo-rollouts
    maintainers: [argoproj]
    license: Apache-2.0
    category: gitops
    curated_by: [cncf-graduated, aws-eks-blueprints, artifacthub-verified]
    security_score: unknown
    github_stars: 2800
    min_kubernetes_version: "1.25"
    quirks:
      - "The controller alone doesn't add traffic-splitting — that needs a supported traffic router (Istio, SMI, an ingress controller, or a cloud load balancer) wired to each Rollout."

  - name: tekton-pipelines
    description: Cloud-native CI/CD pipelines as Kubernetes CRDs.
    chart: tekton-pipeline
    repo: https://cdfoundation.github.io/tekton-helm-chart/
    default_namespace: tekton-pipelines
    docs_url: https://tekton.dev/docs/pipelines/
    homepage: https://tekton.dev/
    source_url: https://github.com/tektoncd/pipeline
    maintainers: [tektoncd, cdfoundation]
    license: Apache-2.0
    category: gitops
    curated_by: [cncf-graduated, artifacthub-verified]
    security_score: unknown
    github_stars: 8700
    min_kubernetes_version: "1.24"
    secrets:
      - name: Registry / git credentials
        description: Supplied via ServiceAccounts on the Tasks/Pipelines you author, not on this chart's values.
        required_for: runtime
    quirks:
      - "No built-in log retention or pruning — completed PipelineRuns/TaskRuns pile up until you configure a pruner or clean them up yourself."

  - name: flux
    description: GitOps operator — reconciles cluster state from Git (sister project to ArgoCD).
    chart: flux2
    repo: https://fluxcd-community.github.io/helm-charts
    default_namespace: flux-system
    docs_url: https://fluxcd.io/flux/
    homepage: https://fluxcd.io/
    source_url: https://github.com/fluxcd/flux2
    maintainers: [fluxcd-community]
    license: Apache-2.0
    category: gitops
    curated_by: [cncf-graduated, artifacthub-verified]
    security_score: unknown
    github_stars: 6600
    min_kubernetes_version: "1.25"
    secrets:
      - name: Git credentials
        description: Needed for a private repo — supplied as a Kubernetes Secret referenced by the GitRepository source you create, not as a chart value.
        required_for: runtime
    quirks:
      - "Runs the same kind of reconciliation loop Argo CD (and Sharko) is already doing — pointing both at the same objects will fight over ownership."

  # -------------------- Storage --------------------

  - name: longhorn
    description: Distributed block storage for Kubernetes — replicas, snapshots, backups.
    chart: longhorn
    repo: https://charts.longhorn.io
    default_namespace: longhorn-system
    docs_url: https://longhorn.io/docs/
    homepage: https://longhorn.io/
    source_url: https://github.com/longhorn/longhorn
    maintainers: [longhorn]
    license: Apache-2.0
    category: storage
    curated_by: [cncf-incubating, artifacthub-verified]
    security_score: unknown
    github_stars: 6400
    min_kubernetes_version: "1.25"
    required_values:
      - key: persistence.defaultClassReplicaCount
        description: How many replicas each volume keeps by default — trades durability for node-local disk usage.
      - key: defaultSettings.defaultDataPath
        description: Where on each node's local disk Longhorn stores volume data.
    quirks:
      - "Needs open-iscsi (or equivalent) installed on every node's host OS before volumes will attach — a plain vanilla node image usually needs a day-2 prep step."

  - name: rook-ceph
    description: Rook operator for Ceph — block, file, and object storage on Kubernetes.
    chart: rook-ceph
    repo: https://charts.rook.io/release
    default_namespace: rook-ceph
    docs_url: https://rook.io/docs/rook/latest/
    homepage: https://rook.io/
    source_url: https://github.com/rook/rook
    maintainers: [rook]
    license: Apache-2.0
    category: storage
    curated_by: [cncf-graduated, artifacthub-verified]
    security_score: unknown
    github_stars: 12400
    min_kubernetes_version: "1.26"
    quirks:
      - "This chart installs the operator only — you still create a CephCluster CR naming the raw block devices Ceph may claim, and it's easy to point it at the wrong disk."

  - name: openebs
    description: Container-attached storage — local PVs, replicated volumes, Mayastor.
    chart: openebs
    repo: https://openebs.github.io/openebs
    default_namespace: openebs
    docs_url: https://openebs.io/docs
    homepage: https://openebs.io/
    source_url: https://github.com/openebs/openebs
    maintainers: [openebs]
    license: Apache-2.0
    category: storage
    curated_by: [cncf-sandbox, artifacthub-verified]
    security_score: unknown
    github_stars: 9100
    min_kubernetes_version: "1.23"
    quirks:
      - "The default LocalPV engine ties data to a single node — losing that node loses the volume, so it isn't a substitute for replicated storage like Longhorn or Rook Ceph."

  # -------------------- Database operators --------------------

  - name: cloudnative-pg
    description: PostgreSQL operator for Kubernetes — HA, backups, rolling upgrades.
    chart: cloudnative-pg
    repo: https://cloudnative-pg.github.io/charts
    default_namespace: cnpg-system
    docs_url: https://cloudnative-pg.io/documentation/
    homepage: https://cloudnative-pg.io/
    source_url: https://github.com/cloudnative-pg/cloudnative-pg
    maintainers: [cloudnative-pg]
    license: Apache-2.0
    category: database
    curated_by: [cncf-incubating, artifacthub-verified]
    security_score: unknown
    github_stars: 5200
    min_kubernetes_version: "1.25"
    secrets:
      - name: Backup destination credentials
        description: S3/GCS/Azure Blob credentials, only needed if you configure continuous WAL archiving/backups on a Cluster CR.
    quirks:
      - "The operator chart alone runs zero databases — you create a Cluster CR to actually get a running PostgreSQL instance."

  - name: strimzi-kafka-operator
    description: Apache Kafka operator — Kafka, ZooKeeper, Connect, MirrorMaker on Kubernetes.
    chart: strimzi-kafka-operator
    repo: https://strimzi.io/charts/
    default_namespace: kafka
    docs_url: https://strimzi.io/documentation/
    homepage: https://strimzi.io/
    source_url: https://github.com/strimzi/strimzi-kafka-operator
    maintainers: [strimzi]
    license: Apache-2.0
    category: database
    curated_by: [cncf-incubating, artifacthub-verified]
    security_score: unknown
    github_stars: 5100
    min_kubernetes_version: "1.25"
    secrets:
      - name: Listener TLS/SASL credentials
        description: Generated by the operator for its own managed listeners, or supplied by you for custom authentication on a Kafka CR.
    quirks:
      - "The operator chart alone runs zero brokers — you create a Kafka CR, and changing broker count or storage class later is a real (if online) migration, not a value tweak."

  # -------------------- Backup / DR --------------------

  - name: velero
    description: Cluster backup, restore, and migration.
    chart: velero
    repo: https://vmware-tanzu.github.io/helm-charts
    default_namespace: velero
    docs_url: https://velero.io/docs/
    homepage: https://velero.io/
    source_url: https://github.com/vmware-tanzu/velero
    maintainers: [vmware-tanzu]
    license: Apache-2.0
    category: backup
    curated_by: [aws-eks-blueprints, artifacthub-verified]
    security_score: unknown
    github_stars: 8900
    min_kubernetes_version: "1.23"
    required_values:
      - key: configuration.backupStorageLocation
        description: Which object store bucket backups are written to, and which cloud provider plugin to use (aws, gcp, azure, ...).
    secrets:
      - name: Backup bucket credentials
        description: Cloud storage credentials for the configured bucket — IRSA/workload identity is preferred over a static key Secret.
    quirks:
      - "Restores don't include PersistentVolume data by default unless you also install and configure the matching CSI/volume-snapshot plugin for your cloud."

  # -------------------- Chaos / testing --------------------

  - name: chaos-mesh
    description: Chaos engineering platform — pod/network/IO/time faults as CRDs.
    chart: chaos-mesh
    repo: https://charts.chaos-mesh.org
    default_namespace: chaos-mesh
    docs_url: https://chaos-mesh.org/docs/
    homepage: https://chaos-mesh.org/
    source_url: https://github.com/chaos-mesh/chaos-mesh
    maintainers: [chaos-mesh]
    license: Apache-2.0
    category: chaos
    curated_by: [cncf-incubating, artifacthub-verified]
    security_score: unknown
    github_stars: 6600
    min_kubernetes_version: "1.24"
    required_values:
      - key: dashboard.securityMode
        description: Keep RBAC mode on — the dashboard can trigger real faults against real workloads if left open.
    quirks:
      - "It can genuinely kill pods, drop network traffic, and fill disks — scope its RBAC to non-production namespaces until your team trusts the blast radius."

  - name: litmus
    description: LitmusChaos — chaos experiments for Kubernetes.
    chart: litmus
    repo: https://litmuschaos.github.io/litmus-helm/
    default_namespace: litmus
    docs_url: https://docs.litmuschaos.io/
    homepage: https://litmuschaos.io/
    source_url: https://github.com/litmuschaos/litmus
    maintainers: [litmuschaos]
    license: Apache-2.0
    category: chaos
    curated_by: [cncf-incubating, artifacthub-verified]
    security_score: unknown
    github_stars: 4400
    min_kubernetes_version: "1.23"
    secrets:
      - name: ChaosCenter admin credentials
        description: Generated on first login to the ChaosCenter UI — nothing to supply up front.
    quirks:
      - "Same caution as chaos-mesh — experiments run real faults against real pods; keep it out of production namespaces until you've dry-run it in staging."

  # -------------------- Developer tools --------------------

  - name: backstage
    description: Spotify's developer portal — service catalog, templates, plugins.
    chart: backstage
    repo: https://backstage.github.io/charts
    default_namespace: backstage
    docs_url: https://backstage.io/docs/
    homepage: https://backstage.io/
    source_url: https://github.com/backstage/backstage
