# spec.addons is where the user's catalog/addons.yaml delta lands when the
# engine pin passes it as the chart's one enveloped Helm values file (design
# doc section 2.5 / D6 — exactly one enveloped file, because every enveloped
# file's payload lives under `spec`, and two would collide). Empty by
# default: a repo with zero addons switched on renders zero
# ApplicationSets, which is correct — Sharko itself, not this chart, is the
# thing a user deletes to kill Sharko (design doc section 2.5).
spec:
  addons: {}
