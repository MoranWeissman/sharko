# -----------------------------------------------------------------------------
# sharko-engine — chart values
#
# See docs/design/2026-07-30-v4-data-file-format.md for the render mechanics
# and .bmad/output/architecture/2026-07-31-catalog-approved-model.md decision
# 6 ("catalog = the approved list") for why this file carries no shipped
# addon data of its own: the engine reads catalog.yaml + cluster-addons/ + values/
# from the user's own repo, nothing else. This file only carries what the
# chart needs to render: where the user's GitOps repo is and the shared
# AppProject name. Everything else — which addons even exist, which clusters
# run them, and their settings — comes from the user's own repo, read at
# render time.
# -----------------------------------------------------------------------------

# repo points the engine at the user's own GitOps repo: the repo that holds
# cluster-addons/, catalog.yaml and values/. In production this is set via
# `helm.parameters` on the engine pin (sharko-engine.yaml) — see design
# doc section 2.5 — never hand-edited here. The values below are placeholders
# so `helm lint` / `helm template` work standalone, against this chart alone.
repo:
  # url is the git remote both generator arms read from: the git-files arm
  # (cluster-addons/<cluster>.yaml) and the `ref: values` source (values/**).
  url: https://github.com/example-org/fleet-gitops.git
  # revision is the branch/tag cluster-addons/, catalog.yaml, and values/ are read
  # from. Almost always "main".
  revision: main

# hostCluster.name lets the addon Application for Sharko's own hub cluster
# route to the in-cluster API server instead of an external URL — the same
# special case v3 had via SHARKO_HOST_CLUSTER_NAME, now passed as a Helm
# parameter instead of a placeholder substituted into the template at
# bootstrap time (design doc section 8, item 7). Leave empty to disable the
# special case (no cluster name will ever match "").
hostCluster:
  name: ""

# project.name is the single shared AppProject every addon Application
# belongs to (design decision D17). v3 created one AppProject per addon with
# every permission set to '*', which bought no real isolation — just one
# extra object per addon. One project is easier to read and is
# engine-internal, not part of the data-file contract, so it may be revisited
# if per-addon restrictions ever become real.
project:
  name: sharko-addons

# addons is where the org's catalog.yaml lands when the engine pin passes it
# as the chart's one enveloped Helm values file (design doc section 2.5 /
# decision D6 — exactly one enveloped file, because every enveloped file's
# payload lives at the top level under the kustomize-school header, and two
# would collide). catalog.yaml entries are FULL entries (repoURL, chart,
# version, namespace, settings, ...) — the org's approved list, never a delta
# against a shipped default (2026-07-31-catalog-approved-model.md decision
# 1). This chart carries no baked/curated addon data any more (decision 6):
# the shipped set that used to live here now lives only on the Sharko
# server, feeding the Marketplace — it never reaches this chart. Empty by
# default: a repo with an empty (or missing) catalog.yaml renders zero
# ApplicationSets, which is correct — nothing runs in the org until an addon
# is approved into the catalog (the day-zero promise, decision 3), and
# Sharko itself, not this chart, is the thing a user deletes to kill Sharko
# (design doc section 2.5).
#
# catalog.yaml's own header fields (apiVersion, kind — decision 9's
# kustomize-school format) ride along as stray top-level Values keys when
# this file is passed as a Helm --values file. Harmless: the chart never
# reads them.
addons: {}

# connectivityCheckOnly switches this chart from "render the whole engine"
# to "render nothing but the connectivity-check ConfigMap" (chart 0.3.0,
# templates/connectivity-check.yaml). It exists so the connectivity check
# has a pullable source without writing a manifest file into the user's
# data-only repo: the ApplicationSet below points a generated Application
# back at THIS SAME CHART (same OCI repoURL, same .Chart.Version) with this
# one value flipped to true. Never set by a user — only ever set by that
# generated Application's own source.helm.parameters. Every other template
# (project.yaml, appset.yaml, the connectivity-check ApplicationSet itself)
# is gated off when this is true, so that render produces exactly one
# resource: the ConfigMap.
connectivityCheckOnly: false

# engineChart.repoURL is this chart's own OCI location — the registry path
# it was pulled from to render right now. Needed only for the
# self-referential connectivity-check Application source (see
# connectivityCheckOnly above); nothing else in the chart reads it. In
# production this is set via a Helm parameter on the engine pin
# (sharko-engine.yaml), the same way repo.url/repo.revision are — see
# internal/orchestrator/bootstrap_v4.go's buildEnginePin, which passes the
# exact same value used for the engine chart's own source.repoURL. The
# value below is a placeholder so `helm lint` / `helm template` work
# standalone, against this chart alone.
engineChart:
  repoURL: ghcr.io/example-org/sharko-engine
