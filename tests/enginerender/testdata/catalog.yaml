# Fixture catalog.yaml — the org's approved list (kind AddonCatalog), exactly
# as decision 1 of .bmad/output/architecture/2026-07-31-catalog-approved-model.md
# defines it: every entry is a FULL entry (repoURL, chart, namespace,
# version), not a delta against a shipped default — the chart carries no
# curated data of its own any more (decision 6). This is the ONE enveloped
# Helm values file the engine pin (engine.yaml) passes to the chart (design
# doc section 2.5 / decision D6), so it is also exactly what the render test
# passes as --values. No `metadata:`/`spec:` wrapper (decision 9, the
# kustomize school): `addons:` sits at the top level alongside apiVersion
# and kind.
apiVersion: sharko.dev/v1
kind: AddonCatalog
addons:
  cert-manager:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    namespace: cert-manager
    version: "1.14.5"
  metrics-server:
    repoURL: https://kubernetes-sigs.github.io/metrics-server/
    chart: metrics-server
    namespace: kube-system
    version: "3.12.1"
