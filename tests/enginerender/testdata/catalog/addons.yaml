# Fixture catalog/addons.yaml — the user's own AddonCatalogDelta, exactly as
# the worked example in docs/design/2026-07-30-v4-data-file-format.md
# section 6 shows it. This is the ONE enveloped Helm values file the engine
# pin (engine/application.yaml) passes to the chart (design decision D6),
# so it is also exactly what the render test passes as --values.
apiVersion: sharko.dev/v1
kind: AddonCatalogDelta
metadata:
  name: addon-catalog-delta
spec:
  addons:
    cert-manager:
      version: "1.14.5"
    metrics-server:
      version: "3.12.1"
